logoutput: stderr
internal: 0.0.0.0 port = 1080
external: eth0
external: eth1
external.rotation: route
socksmethod: none
clientmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

# Lab targets only: refuse loopback of the proxy itself.
socks block {
    from: 0.0.0.0/0 to: 127.0.0.0/8
    log: connect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect error
    socksmethod: none
}
