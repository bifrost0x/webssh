[global]
    server role = standalone server
    workgroup = LAB
    netbios name = LABSMB
    server min protocol = SMB3_11
    server max protocol = SMB3_11
    server signing = mandatory
    # Encryption is negotiable; [Secure] forces it, [Plain] disables it.
    server smb encrypt = if_required
    ntlm auth = ntlmv2-only
    map to guest = Never
    restrict anonymous = 2
    disable netbios = yes
    smb ports = 445
    host msdfs = no
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log level = 1
    logging = file
    log file = /dev/stdout

[Secure]
    path = /srv/samba/secure
    read only = no
    valid users = smbuser
    server smb encrypt = required
    follow symlinks = no
    wide links = no

[Plain]
    path = /srv/samba/plain
    read only = no
    valid users = smbuser
    server smb encrypt = off
    follow symlinks = no
    wide links = no

[ReadOnly]
    path = /srv/samba/readonly
    read only = yes
    valid users = smbuser smbreader
    follow symlinks = no
    wide links = no
