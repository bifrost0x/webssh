[global]
    server role = standalone server
    workgroup = WORKGROUP
    server min protocol = SMB3_11
    server max protocol = SMB3_11
    server signing = mandatory
    smb encrypt = required
    map to guest = Never
    restrict anonymous = 2
    usershare allow guests = no
    host msdfs = no
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log level = 1
    log file = /dev/stdout

[Docs]
    path = /srv/samba/docs
    browseable = yes
    read only = no
    guest ok = no
    valid users = smbuser
    follow symlinks = no
    wide links = no

[Denied]
    path = /srv/samba/denied
    browseable = no
    read only = yes
    guest ok = no
    valid users = blockeduser
    follow symlinks = no

[ReadOnly]
    path = /srv/samba/readonly
    browseable = yes
    read only = yes
    guest ok = no
    valid users = smbuser
    follow symlinks = no
    wide links = no
