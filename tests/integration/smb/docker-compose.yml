services:
  samba:
    build: .
    ports:
      - "127.0.0.1:1445:445"
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L //127.0.0.1 -U 'smbuser%Smb-Lab-Only-42!' -m SMB3 >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  client:
    build:
      context: ../../..
    working_dir: /workspace
    volumes:
      - ../../..:/workspace:ro
    environment:
      DEPLOYMENT_PROFILE: homelab
      SECRET_KEY: smb-integration-only-secret
      SMB_ENABLED: "true"
      SMB_ALLOWED_TARGETS: samba
      SMB_INTEGRATION: "1"
      SMB_INTEGRATION_HOST: samba
      SMB_INTEGRATION_USER: smbuser
      SMB_INTEGRATION_PASSWORD: Smb-Lab-Only-42!
      PYTHONPATH: /workspace
    depends_on:
      samba:
        condition: service_healthy
    command: ["python", "tests/integration/test_smb_integration.py"]
