name: Deploy Product Site and Code Graph to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'

      - name: Install locked graph dependencies
        run: |
          uv venv
          uv pip install --require-hashes -r requirements-graph.txt

      - name: Build code graph
        run: .venv/bin/graphify update .

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R assets _site/assets
          mkdir -p _site/code-graph
          cp graphify-out/graph.html _site/code-graph/index.html
          .venv/bin/python - <<'PY'
          import re
          from pathlib import Path

          graph_page = Path("_site/code-graph/index.html")
          vendor_asset = Path("_site/vendor/vis-network-9.1.6/vis-network.min.js")
          cdn_url = "https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"
          local_url = "../vendor/vis-network-9.1.6/vis-network.min.js"

          if not vendor_asset.is_file():
              raise SystemExit(f"Missing vendored graph dependency: {vendor_asset}")

          graph_html = graph_page.read_text(encoding="utf-8")
          if graph_html.count(cdn_url) != 1:
              raise SystemExit("Graphify vis-network URL was missing or appeared more than once")

          graph_html = graph_html.replace(cdn_url, local_url)
          external_assets = re.findall(
              r'<(?:script|link)\b[^>]*(?:src|href)=["\']https?://[^"\']+',
              graph_html,
              flags=re.IGNORECASE,
          )
          if external_assets:
              raise SystemExit(f"External code-graph runtime assets remain: {external_assets}")

          graph_page.write_text(graph_html, encoding="utf-8")
          PY
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment
