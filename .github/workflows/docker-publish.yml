name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A new PR revision supersedes its scans. Release runs use separate groups;
# only the publication job below serializes writes to public image tags.
concurrency:
  group: image-validation-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scan:
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

  release-tests:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tests.yml
    with:
      expected_sha: ${{ github.sha }}
    permissions:
      contents: read

  build-candidate:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The release version is the default of ARG VERSION in the
            # Dockerfile (both stages); the binary reports it.
            version="$(sed -n 's/^ARG VERSION=//p' Dockerfile | sort -u)"
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match ARG VERSION of the Dockerfile ($version)" >&2
              exit 1
            fi
          fi
          echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract candidate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build immutable native candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: release
          platforms: linux/${{ matrix.arch }}
          pull: true
          outputs: type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=security-${{ matrix.arch }}
            type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.arch }}

      # Same builder, inputs and cache as the release target, so the stages
      # both targets share are reused and carry the same binary.
      - name: Build immutable native debug candidate
        id: build-debug
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: debug
          platforms: linux/${{ matrix.arch }}
          pull: true
          outputs: type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=security-${{ matrix.arch }}
            type=gha,scope=publish-${{ matrix.arch }}

      - name: Validate native candidate identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DEBUG_DIGEST: ${{ steps.build-debug.outputs.digest }}
          CANDIDATE_PLATFORM: linux/${{ matrix.arch }}
        shell: bash
        run: |
          python scripts/release_image.py inspect-platform \
            --image "$IMAGE_REF" --digest "$IMAGE_DIGEST" \
            --revision "$GITHUB_SHA" --platform "$CANDIDATE_PLATFORM" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output image-candidate.json
          python scripts/release_image.py inspect-platform \
            --image "$IMAGE_REF" --digest "$DEBUG_DIGEST" \
            --revision "$GITHUB_SHA" --platform "$CANDIDATE_PLATFORM" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output image-candidate-debug.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          for path, name in (('image-candidate.json', 'RUNTIME_REF'),
                             ('image-candidate-debug.json', 'DEBUG_REF')):
              candidate = json.load(open(path))
              digest, = candidate['platforms'].values()
              print(f"{name}={candidate['repository']}@{digest}")
          PY

      - name: Scan exact native candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.RUNTIME_REF }}
          format: json
          output: candidate-trivy.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore.yaml

      # Trivy does not detect BusyBox; tests/image/check.sh asserts its version.
      - name: Scan exact native debug candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.DEBUG_REF }}
          format: json
          output: candidate-trivy-debug.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore.yaml

      # The exact debug candidate lends BusyBox to the checks that inspect
      # files and is checked itself; every other container under test runs
      # the exact release candidate.
      - name: Verify compatible and hardened runtime of exact native candidates
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker pull "$RUNTIME_REF"
          docker pull "$DEBUG_REF"
          BUILD=0 IMG="$RUNTIME_REF" DEBUG_IMG="$DEBUG_REF" tests/image/check.sh

      # This success-only artifact is the handoff: failed scans/runtime checks
      # never produce promotable evidence. Each matrix leg owns a distinct name.
      # A successful rerun replaces it; failed-job retries may reuse prior success.
      - name: Upload verified native identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            image-candidate.json
            image-candidate-debug.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload native scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: |
            image-candidate.json
            image-candidate-debug.json
            candidate-trivy.json
            candidate-trivy-debug.json
          if-no-files-found: warn
          retention-days: 90

  build-and-push:
    needs: [release-tests, build-candidate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: image-publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download this run's verified AMD64 identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-amd64
          path: candidates/amd64

      - name: Download this run's verified ARM64 identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-arm64
          path: candidates/arm64

      # Each index keeps its own candidate tag (candidate-<run>-<attempt> and
      # candidate-<run>-<attempt>-debug), which image-retention.yml never prunes.
      - name: Assemble and validate complete candidate indexes
        shell: bash
        run: |
          python scripts/release_image.py assemble \
            --image "$IMAGE_REF" --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence candidates/amd64/image-candidate.json candidates/arm64/image-candidate.json \
            --output image-candidate.json
          python scripts/release_image.py assemble --variant debug \
            --image "$IMAGE_REF" --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence candidates/amd64/image-candidate-debug.json candidates/arm64/image-candidate-debug.json \
            --output image-candidate-debug.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          for path, name in (('image-candidate.json', 'IMAGE_DIGEST'),
                             ('image-candidate-debug.json', 'DEBUG_DIGEST')):
              candidate = json.load(open(path))
              print(f"{name}={candidate['digest']}")
          PY

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # main publishes debug, a tag vX.Y.Z publishes X.Y.Z-debug and
      # X.Y-debug; the debug image never becomes latest.
      - name: Extract debug metadata (tags)
        id: meta-debug
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REF }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=debug,enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-debug
            type=semver,pattern={{major}}.{{minor}},suffix=-debug

      - name: Promote the verified index without rebuilding
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          DEBUG_TAGS: ${{ steps.meta-debug.outputs.tags }}
        shell: bash
        run: |
          promotion_args=()
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            promotion_args+=(--require-current-main)
          fi
          printf '%s\n' "$RELEASE_TAGS" > release-tags.txt
          printf '%s\n' "$DEBUG_TAGS" > debug-tags.txt
          python scripts/release_image.py promote \
            --image "$IMAGE_REF" --digest "$IMAGE_DIGEST" \
            --revision "$GITHUB_SHA" --tags-file release-tags.txt \
            --output image-release.json "${promotion_args[@]}"
          python scripts/release_image.py promote \
            --image "$IMAGE_REF" --digest "$DEBUG_DIGEST" \
            --revision "$GITHUB_SHA" --tags-file debug-tags.txt \
            --output image-release-debug.json "${promotion_args[@]}"

      - name: Upload immutable image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-release.json
            image-release-debug.json
          if-no-files-found: error
          retention-days: 90
