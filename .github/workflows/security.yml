name: Container Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify changes
        id: scope
        run: python scripts/ci_change_scope.py

  image-security-amd64:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    name: Image security (AMD64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build native AMD64 PR scan candidate
        if: github.event_name == 'pull_request'
        run: bash scripts/build_pr_scan_image.sh amd64

      - name: Build AMD64 scan candidate
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: webssh-security:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=security-amd64
          cache-to: type=gha,mode=max,scope=security-amd64

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
          image: webssh-security:${{ github.sha }}
          format: spdx-json
          output-file: webssh.spdx.json
          artifact-name: webssh-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.spdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan fixable high and critical vulnerabilities
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: webssh-security:${{ github.sha }}
          format: json
          output: trivy-results-amd64.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Upload AMD64 Trivy result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-amd64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-results-amd64.json
          if-no-files-found: error
          retention-days: 14

  image-security-arm64:
    needs: change-scope
    if: needs.change-scope.outputs.mode == 'full'
    name: Image security (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build native ARM64 PR scan candidate
        if: github.event_name == 'pull_request'
        run: bash scripts/build_pr_scan_image.sh arm64

      - name: Build ARM64 scan candidate
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          outputs: type=docker,dest=/tmp/webssh-arm64.tar
          build-args: |
            VCS_REF=${{ github.sha }}
            OS_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=security-arm64
          cache-to: type=gha,mode=max,scope=security-arm64

      - name: Scan ARM64 fixable high and critical vulnerabilities
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          input: /tmp/webssh-arm64.tar
          format: json
          output: trivy-results-arm64.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Upload ARM64 Trivy result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-results-arm64.json
          if-no-files-found: error
          retention-days: 14

  image-security:
    needs: [change-scope, image-security-amd64, image-security-arm64]
    if: ${{ always() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require planned architecture scans
        env:
          GATE_KIND: images
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/check_release_gates.py
