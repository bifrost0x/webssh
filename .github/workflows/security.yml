name: Container Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  image-security:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build AMD64 scan candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: webssh-security:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ARM64 scan candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          outputs: type=docker,dest=/tmp/webssh-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: webssh-security:${{ github.sha }}
          format: spdx-json
          output-file: webssh.spdx.json
          artifact-name: webssh-${{ github.sha }}.spdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan fixable high and critical vulnerabilities
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: webssh-security:${{ github.sha }}
          format: json
          output: trivy-results-amd64.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Scan ARM64 fixable high and critical vulnerabilities
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/webssh-arm64.tar
          format: json
          output: trivy-results-arm64.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ github.sha }}
          path: trivy-results-*.json
          if-no-files-found: error
          retention-days: 14
