name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit that the caller will publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that this manually dispatched run must test
        required: true
        type: string

# Main and tag pushes invoke this workflow only through docker-publish.yml.
# Standalone PR runs supersede each other; release callers retain their exact-SHA gates.
concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.expected_sha && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-integrity:
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify manually dispatched commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
          fi

      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject private development artifacts
        run: python scripts/check_repository_hygiene.py
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          set -eu
          tool_dir="$RUNNER_TEMP/webssh-gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
      - name: Scan tracked source and verify secret-detection canaries
        run: python scripts/check_repository_secrets.py --gitleaks "$RUNNER_TEMP/webssh-gitleaks/gitleaks"
      - name: Classify changes
        id: scope
        env:
          CI_FORCE_FULL: ${{ inputs.expected_sha != '' }}
        run: python scripts/ci_change_scope.py
      - name: Validate documentation contracts
        run: python -m unittest discover -s tests -p test_documentation_surface.py -v

  dependency-locks:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      redis7:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis8:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'

      - name: Check dependency locks
        shell: pwsh
        run: ./scripts/lock_requirements.ps1 -Check

      - name: Install LDAP build dependencies
        run: bash scripts/install_ci_test_system_deps.sh

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Run Python 3.11 minimum compatibility
        run: >-
          python -m compileall -q app tests &&
          python -m pytest
          tests/test_admin_cli.py
          tests/test_backup_manager.py
          tests/test_deployment_compatibility.py
          tests/test_auth.py
          tests/test_entrypoint.py
          tests/test_factor_bootstrap.py
          tests/test_file_service.py
          tests/test_gunicorn_command.py
          tests/test_ldap_auth.py
          tests/test_network_policy.py
          tests/test_production_config.py
          tests/test_sftp_handler.py
          tests/test_smb_protocol_contract.py
          tests/test_ssh_manager.py
          tests/test_storage_migrations.py
          tests/test_threaded_runtime.py
          -p scripts.pytest_shard --ci-shard=1/1
          -q -n 2 --dist=loadscope --durations=30
          --basetemp=test-results/python-minimum

      - name: Run Redis 7 rate limiter test
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: >-
          python -m pytest
          tests/test_rate_limiter.py::test_real_redis_does_not_store_denied_requests
          -q --basetemp=test-results/redis-7

      - name: Run Redis 8 rate limiter test
        env:
          TEST_REDIS_URL: redis://localhost:6380/15
        run: >-
          python -m pytest
          tests/test_rate_limiter.py::test_real_redis_does_not_store_denied_requests
          -q --basetemp=test-results/redis-8

  pytest-shards:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.14'
            check_name: pytest (Python 3.14 shard 1/3)
            pytest_shard: 1/3
            pytest_targets: tests/
            pytest_ignores: --ignore=tests/integration --ignore=tests/test_documentation_surface.py
          - python_version: '3.14'
            check_name: pytest (Python 3.14 shard 2/3)
            pytest_shard: 2/3
            pytest_targets: tests/
            pytest_ignores: --ignore=tests/integration --ignore=tests/test_documentation_surface.py
          - python_version: '3.14'
            check_name: pytest (Python 3.14 shard 3/3)
            pytest_shard: 3/3
            pytest_targets: tests/
            pytest_ignores: --ignore=tests/integration --ignore=tests/test_documentation_surface.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The documented minimum runs with dependency locks and Redis above.
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: bash scripts/install_ci_test_system_deps.sh

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: >-
          python -m compileall -q app tests &&
          python -m pytest ${{ matrix.pytest_targets }}
          ${{ matrix.pytest_ignores }}
          -p scripts.pytest_shard --ci-shard=${{ matrix.pytest_shard }}
          -q
          -n 2
          --dist=loadscope
          --durations=30

  pytest:
    needs: [dispatch-integrity, pytest-shards, dependency-locks]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every Python shard and minimum-version check
        env:
          PYTEST_RESULT: ${{ needs.pytest-shards.result }}
          MINIMUM_RESULT: ${{ needs.dependency-locks.result }}
        run: test "$PYTEST_RESULT" = success && test "$MINIMUM_RESULT" = success

  redis-rate-limiter:
    needs: [dispatch-integrity, dependency-locks]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require both Redis versions
        env:
          REDIS_RESULT: ${{ needs.dependency-locks.result }}
        run: test "$REDIS_RESULT" = success

  ssh-integration:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run disposable OpenSSH, SMB and release promotion checks
        run: python scripts/run_ci_protocol_checks.py

      - name: Upload real-browser integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  smb-integration:
    needs: [dispatch-integrity, ssh-integration]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Require encrypted SMB integration success
        env:
          SMB_RESULT: ${{ needs.ssh-integration.result }}
        run: test "$SMB_RESULT" = success

  browser-e2e-shards:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: browser-e2e (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      WEBSSH_E2E_PORT: '4173'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: bash scripts/install_ci_test_system_deps.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Check vendored frontend assets
        if: matrix.group == 1
        run: npm run vendor:check

      - name: Lint JavaScript
        if: matrix.group == 1
        run: npm run lint:js

      - name: Run JavaScript unit tests
        if: matrix.group == 1
        run: npm run test:js

      - name: Install locked Playwright Chromium
        run: node scripts/install-ci-chromium.js

      - name: Run required local browser gate
        run: node scripts/run-e2e-ci-parallel.js --group=${{ matrix.group }}/8 --lanes=4

      - name: Upload browser timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ matrix.group }}-timings
          overwrite: true
          path: test-results/e2e-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ matrix.group }}-failure
          overwrite: true
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-fonts:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: browser-fonts (Firefox and WebKit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WEBSSH_E2E_FAST_HASHING: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install LDAP build dependencies
        run: bash scripts/install_ci_test_system_deps.sh
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install locked font-test browsers
        run: |
          node scripts/install-ci-chromium.js firefox
          node scripts/install-ci-chromium.js webkit
      - name: Verify live terminal font changes
        run: |
          WEBSSH_E2E_PORT=4173 \
            WEBSSH_E2E_TIMING_FILE="test-results/e2e-fonts-firefox.json" \
            npm run test:e2e -- tests/e2e/session-workspace.spec.js \
            --browser=firefox --output="test-results/font-firefox" \
            --grep='font changes preserve|failed font downloads' &
          firefox_pid=$!
          WEBSSH_E2E_PORT=4174 \
            WEBSSH_E2E_TIMING_FILE="test-results/e2e-fonts-webkit.json" \
            npm run test:e2e -- tests/e2e/session-workspace.spec.js \
            --browser=webkit --output="test-results/font-webkit" \
            --grep='font changes preserve|failed font downloads' &
          webkit_pid=$!
          firefox_status=0
          webkit_status=0
          wait "$firefox_pid" || firefox_status=$?
          wait "$webkit_pid" || webkit_status=$?
          test "$firefox_status" -eq 0
          test "$webkit_status" -eq 0
      - name: Upload font-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-fonts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    needs: [dispatch-integrity, browser-e2e-shards, browser-fonts]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Require all browser shards
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shards.result }}
          FONT_RESULT: ${{ needs.browser-fonts.result }}
        run: |
          test "$SHARD_RESULT" = success
          test "$FONT_RESULT" = success

  container-threading-smoke:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Docker context exclusions and runtime inputs
        run: python scripts/check_container_context.py

      - name: Build and start this checkout
        shell: bash
        run: |
          image_tag="webssh-ci:${GITHUB_SHA}"
          container_name="webssh-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          recovery_volume="webssh-ci-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_label="webssh.ci-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_value="${ownership_label#*=}"
          recovery_volume_created=0

          cleanup_start_failure() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ] && docker container inspect "$container_name" >/dev/null 2>&1; then
              if actual_label="$(docker container inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$container_name" 2>/dev/null)"; then
                if [ "$actual_label" = "$ownership_value" ]; then
                  docker rm --force --volumes "$container_name" || true
                fi
              fi
            fi

            if [ "$status" -ne 0 ] && [ "$recovery_volume_created" = "1" ] \
              && docker volume inspect "$recovery_volume" >/dev/null 2>&1; then
              if actual_label="$(docker volume inspect --format '{{ index .Labels "webssh.ci-run" }}' "$recovery_volume" 2>/dev/null)"; then
                if [ "$actual_label" = "$ownership_value" ]; then
                  docker volume rm "$recovery_volume" || true
                fi
              fi
            fi

            exit "$status"
          }
          trap cleanup_start_failure EXIT

          if docker container inspect "$container_name" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing container $container_name" >&2
            exit 1
          fi
          if docker volume inspect "$recovery_volume" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing volume $recovery_volume" >&2
            exit 1
          fi

          docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag "$image_tag" .
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_tag")"
          if [ "$image_revision" != "$GITHUB_SHA" ]; then
            echo "Built image revision does not match the checkout" >&2
            exit 1
          fi
          docker volume create \
            --label "$ownership_label" \
            "$recovery_volume" >/dev/null
          recovery_volume_created=1
          docker run --detach --name "$container_name" \
            --label "$ownership_label" \
            --env SECRET_KEY="container-smoke-test-secret" \
            --env BACKUP_TEMP_DIR=/app/recovery \
            --env BACKUP_RECOVERY_DURABLE=true \
            --mount type=volume,source="$recovery_volume",target=/app/recovery \
            --publish 127.0.0.1::5000 \
            "$image_tag"

          {
            echo "WEBSSH_CI_CONTAINER=$container_name"
            echo "WEBSSH_CI_CONTAINER_LABEL_VALUE=$ownership_value"
            echo "WEBSSH_CI_CONTAINER_CREATED=1"
            echo "WEBSSH_CI_RECOVERY_VOLUME=$recovery_volume"
            echo "WEBSSH_CI_RECOVERY_VOLUME_CREATED=1"
          } >> "$GITHUB_ENV"
          trap - EXIT

      - name: Verify packaged runtime files
        run: python scripts/check_container_context.py --container "$WEBSSH_CI_CONTAINER"

      - name: Verify recovery volume, gthread worker and readiness
        shell: bash
        run: |
          binding="$(docker port "$WEBSSH_CI_CONTAINER" 5000/tcp | head --lines=1)"
          port="${binding##*:}"
          ready=0

          for attempt in {1..30}; do
            ready_status="$(curl --output /dev/null --silent --show-error --write-out '%{http_code}' "http://127.0.0.1:${port}/ready" || true)"
            if docker logs "$WEBSSH_CI_CONTAINER" 2>&1 | grep --quiet --fixed-strings "Using worker: gthread" \
              && [ "$ready_status" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            docker logs "$WEBSSH_CI_CONTAINER" >&2
            exit 1
          fi

          mounted_volume="$(docker inspect --format '{{ range .Mounts }}{{ if eq .Destination "/app/recovery" }}{{ .Name }}{{ end }}{{ end }}' "$WEBSSH_CI_CONTAINER")"
          if [ "$mounted_volume" != "$WEBSSH_CI_RECOVERY_VOLUME" ]; then
            echo "Recovery path is not backed by the fresh CI volume" >&2
            exit 1
          fi
          docker exec "$WEBSSH_CI_CONTAINER" sh -eu -c '
            expected_owner="$(id -u):$(id -g):700"
            actual_owner="$(stat --format=%u:%g:%a /app/recovery)"
            test "$actual_owner" = "$expected_owner"
            test -w /app/recovery
            probe=/app/recovery/.webssh-ci-write-probe
            : > "$probe"
            rm -f "$probe"
          '

      - name: Verify graceful gthread shutdown
        shell: bash
        run: |
          actual_label="$(docker inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_CI_CONTAINER")"
          if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
            echo "Refusing to stop container with unexpected ownership label" >&2
            exit 1
          fi
          docker stop --time 35 "$WEBSSH_CI_CONTAINER"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$WEBSSH_CI_CONTAINER")"
          test "$exit_code" = "0"

      - name: Verify production compatibility, hardening and recovery
        shell: bash
        run: python scripts/check_hardened_container.py --image "webssh-ci:${GITHUB_SHA}" --revision "$GITHUB_SHA"

      - name: Clean up created container
        if: always()
        shell: bash
        run: |
          if [ "${WEBSSH_CI_CONTAINER_CREATED:-0}" = "1" ] \
            && docker container inspect "$WEBSSH_CI_CONTAINER" >/dev/null 2>&1; then
            actual_label="$(docker container inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_CI_CONTAINER")"
            if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
              echo "Refusing to remove container with unexpected ownership label" >&2
              exit 1
            fi

            docker rm --force --volumes "$WEBSSH_CI_CONTAINER"
          fi

          if [ "${WEBSSH_CI_RECOVERY_VOLUME_CREATED:-0}" = "1" ] \
            && docker volume inspect "$WEBSSH_CI_RECOVERY_VOLUME" >/dev/null 2>&1; then
            actual_label="$(docker volume inspect --format '{{ index .Labels "webssh.ci-run" }}' "$WEBSSH_CI_RECOVERY_VOLUME")"
            if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
              echo "Refusing to remove volume with unexpected ownership label" >&2
              exit 1
            fi

            docker volume rm "$WEBSSH_CI_RECOVERY_VOLUME"
          fi

  release-contract:
    needs: [dispatch-integrity, ssh-integration]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require immutable release promotion contract success
        env:
          RELEASE_RESULT: ${{ needs.ssh-integration.result }}
        run: test "$RELEASE_RESULT" = success

  all-tests:
    needs: [dispatch-integrity, dependency-locks, pytest-shards, pytest, redis-rate-limiter, ssh-integration, smb-integration, browser-e2e-shards, browser-fonts, browser-e2e, container-threading-smoke, release-contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require every test gate
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/check_release_gates.py
