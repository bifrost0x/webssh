name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit that the caller will publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that this manually dispatched run must test
        required: true
        type: string

# Main and tag pushes invoke this workflow only through docker-publish.yml.
# Standalone PR runs supersede each other; release callers retain their exact-SHA gates.
concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.expected_sha && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-integrity:
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify manually dispatched commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
          fi

      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject private development artifacts
        run: python scripts/check_repository_hygiene.py
      - name: Classify changes
        id: scope
        env:
          CI_FORCE_FULL: ${{ inputs.expected_sha != '' }}
        run: python scripts/ci_change_scope.py
      - name: Validate documentation contracts
        run: python -m unittest discover -s tests -p test_documentation_surface.py -v

  dependency-locks:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'

      - name: Check dependency locks
        shell: pwsh
        run: ./scripts/lock_requirements.ps1 -Check

  pytest:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.14'
            check_name: pytest
            pytest_targets: tests/
            pytest_ignores: --ignore=tests/integration --ignore=tests/test_documentation_surface.py
          - python_version: '3.11'
            check_name: pytest (Python 3.11 minimum)
            # The production runtime runs the complete suite above.  The
            # documented minimum version keeps a representative compatibility
            # gate across startup, authentication, storage migrations, remote
            # protocols, pagination, and threaded transport admission.
            pytest_targets: >-
              tests/test_admin_cli.py
              tests/test_backup_manager.py
              tests/test_deployment_compatibility.py
              tests/test_auth.py
              tests/test_entrypoint.py
              tests/test_factor_bootstrap.py
              tests/test_file_service.py
              tests/test_gunicorn_command.py
              tests/test_ldap_auth.py
              tests/test_network_policy.py
              tests/test_production_config.py
              tests/test_sftp_handler.py
              tests/test_smb_protocol_contract.py
              tests/test_ssh_manager.py
              tests/test_storage_migrations.py
              tests/test_threaded_runtime.py
            pytest_ignores: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Test both the production runtime and documented minimum version.
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: >-
          python -m compileall -q app tests &&
          pytest ${{ matrix.pytest_targets }}
          ${{ matrix.pytest_ignores }}
          -q
          -n 2
          --dist=loadscope
          --durations=30

  redis-rate-limiter:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: Redis rate limiter (${{ matrix.redis-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - redis-version: '7'
            redis-image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          - redis-version: '8'
            redis-image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: ${{ matrix.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run Redis rate limiter tests
        run: >-
          pytest
          tests/test_rate_limiter.py::test_real_redis_does_not_store_denied_requests
          -q

  ssh-integration:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run disposable OpenSSH integration tests
        run: python scripts/run_integration_tests.py

  smb-integration:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run disposable encrypted SMB integration tests
        run: python scripts/run_smb_integration_tests.py

  browser-e2e-shards:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: browser-e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            e2e_port: 4173
            run_static_checks: true
          - shard: 2
            e2e_port: 4174
            run_static_checks: false
    env:
      WEBSSH_E2E_PORT: ${{ matrix.e2e_port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Check vendored frontend assets
        if: matrix.run_static_checks
        run: npm run vendor:check

      - name: Lint JavaScript
        if: matrix.run_static_checks
        run: npm run lint:js

      - name: Run JavaScript unit tests
        if: matrix.run_static_checks
        run: npm run test:js

      - name: Install locked Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run required local browser gate
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/2

      - name: Upload browser timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ matrix.shard }}-timings
          overwrite: true
          path: test-results/e2e-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ matrix.shard }}-failure
          overwrite: true
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    needs: [dispatch-integrity, browser-e2e-shards]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Require all browser shards
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shards.result }}
        run: test "$SHARD_RESULT" = success

  container-threading-smoke:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and start this checkout
        shell: bash
        run: |
          image_tag="webssh-ci:${GITHUB_SHA}"
          container_name="webssh-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          recovery_volume="webssh-ci-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_label="webssh.ci-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_value="${ownership_label#*=}"
          recovery_volume_created=0

          cleanup_start_failure() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ] && docker container inspect "$container_name" >/dev/null 2>&1; then
              if actual_label="$(docker container inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$container_name" 2>/dev/null)"; then
                if [ "$actual_label" = "$ownership_value" ]; then
                  docker rm --force --volumes "$container_name" || true
                fi
              fi
            fi

            if [ "$status" -ne 0 ] && [ "$recovery_volume_created" = "1" ] \
              && docker volume inspect "$recovery_volume" >/dev/null 2>&1; then
              if actual_label="$(docker volume inspect --format '{{ index .Labels "webssh.ci-run" }}' "$recovery_volume" 2>/dev/null)"; then
                if [ "$actual_label" = "$ownership_value" ]; then
                  docker volume rm "$recovery_volume" || true
                fi
              fi
            fi

            exit "$status"
          }
          trap cleanup_start_failure EXIT

          if docker container inspect "$container_name" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing container $container_name" >&2
            exit 1
          fi
          if docker volume inspect "$recovery_volume" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing volume $recovery_volume" >&2
            exit 1
          fi

          docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag "$image_tag" .
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_tag")"
          if [ "$image_revision" != "$GITHUB_SHA" ]; then
            echo "Built image revision does not match the checkout" >&2
            exit 1
          fi
          docker volume create \
            --label "$ownership_label" \
            "$recovery_volume" >/dev/null
          recovery_volume_created=1
          docker run --detach --name "$container_name" \
            --label "$ownership_label" \
            --env SECRET_KEY="container-smoke-test-secret" \
            --env BACKUP_TEMP_DIR=/app/recovery \
            --env BACKUP_RECOVERY_DURABLE=true \
            --mount type=volume,source="$recovery_volume",target=/app/recovery \
            --publish 127.0.0.1::5000 \
            "$image_tag"

          {
            echo "WEBSSH_CI_CONTAINER=$container_name"
            echo "WEBSSH_CI_CONTAINER_LABEL_VALUE=$ownership_value"
            echo "WEBSSH_CI_CONTAINER_CREATED=1"
            echo "WEBSSH_CI_RECOVERY_VOLUME=$recovery_volume"
            echo "WEBSSH_CI_RECOVERY_VOLUME_CREATED=1"
          } >> "$GITHUB_ENV"
          trap - EXIT

      - name: Verify recovery volume, gthread worker and readiness
        shell: bash
        run: |
          binding="$(docker port "$WEBSSH_CI_CONTAINER" 5000/tcp | head --lines=1)"
          port="${binding##*:}"
          ready=0

          for attempt in {1..30}; do
            ready_status="$(curl --output /dev/null --silent --show-error --write-out '%{http_code}' "http://127.0.0.1:${port}/ready" || true)"
            if docker logs "$WEBSSH_CI_CONTAINER" 2>&1 | grep --quiet --fixed-strings "Using worker: gthread" \
              && [ "$ready_status" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            docker logs "$WEBSSH_CI_CONTAINER" >&2
            exit 1
          fi

          mounted_volume="$(docker inspect --format '{{ range .Mounts }}{{ if eq .Destination "/app/recovery" }}{{ .Name }}{{ end }}{{ end }}' "$WEBSSH_CI_CONTAINER")"
          if [ "$mounted_volume" != "$WEBSSH_CI_RECOVERY_VOLUME" ]; then
            echo "Recovery path is not backed by the fresh CI volume" >&2
            exit 1
          fi
          docker exec "$WEBSSH_CI_CONTAINER" sh -eu -c '
            expected_owner="$(id -u):$(id -g):700"
            actual_owner="$(stat --format=%u:%g:%a /app/recovery)"
            test "$actual_owner" = "$expected_owner"
            test -w /app/recovery
            probe=/app/recovery/.webssh-ci-write-probe
            : > "$probe"
            rm -f "$probe"
          '

      - name: Verify graceful gthread shutdown
        shell: bash
        run: |
          actual_label="$(docker inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_CI_CONTAINER")"
          if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
            echo "Refusing to stop container with unexpected ownership label" >&2
            exit 1
          fi
          docker stop --time 35 "$WEBSSH_CI_CONTAINER"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$WEBSSH_CI_CONTAINER")"
          test "$exit_code" = "0"

      - name: Verify production compatibility, hardening and recovery
        shell: bash
        run: python scripts/check_hardened_container.py --image "webssh-ci:${GITHUB_SHA}" --revision "$GITHUB_SHA"

      - name: Clean up created container
        if: always()
        shell: bash
        run: |
          if [ "${WEBSSH_CI_CONTAINER_CREATED:-0}" = "1" ] \
            && docker container inspect "$WEBSSH_CI_CONTAINER" >/dev/null 2>&1; then
            actual_label="$(docker container inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_CI_CONTAINER")"
            if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
              echo "Refusing to remove container with unexpected ownership label" >&2
              exit 1
            fi

            docker rm --force --volumes "$WEBSSH_CI_CONTAINER"
          fi

          if [ "${WEBSSH_CI_RECOVERY_VOLUME_CREATED:-0}" = "1" ] \
            && docker volume inspect "$WEBSSH_CI_RECOVERY_VOLUME" >/dev/null 2>&1; then
            actual_label="$(docker volume inspect --format '{{ index .Labels "webssh.ci-run" }}' "$WEBSSH_CI_RECOVERY_VOLUME")"
            if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
              echo "Refusing to remove volume with unexpected ownership label" >&2
              exit 1
            fi

            docker volume rm "$WEBSSH_CI_RECOVERY_VOLUME"
          fi

  release-contract:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Exercise immutable promotion against a disposable local registry
        run: python scripts/check_release_promotion.py

  all-tests:
    needs: [dispatch-integrity, dependency-locks, pytest, redis-rate-limiter, ssh-integration, smb-integration, browser-e2e-shards, browser-e2e, container-threading-smoke, release-contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require every test gate
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/check_release_gates.py
