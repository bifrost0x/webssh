name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that this manually dispatched run must test
        required: true
        type: string

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-integrity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify manually dispatched commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
          fi

  dependency-locks:
    needs: dispatch-integrity
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.3'

      - name: Check dependency locks
        shell: pwsh
        run: ./scripts/lock_requirements.ps1 -Check

  pytest:
    needs: dispatch-integrity
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.14'
            check_name: pytest
          - python_version: '3.11'
            check_name: pytest (Python 3.11 minimum)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Test both the production runtime and documented minimum version.
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: >-
          pytest tests/
          --ignore=tests/integration
          -q
          -n 2
          --dist=loadscope
          --durations=30

  redis-rate-limiter:
    needs: dispatch-integrity
    name: Redis rate limiter (${{ matrix.redis-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - redis-version: '7'
            redis-image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          - redis-version: '8'
            redis-image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    services:
      redis:
        image: ${{ matrix.redis-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run Redis rate limiter tests
        run: >-
          pytest
          tests/test_rate_limiter.py::test_real_redis_does_not_store_denied_requests
          -q

  ssh-integration:
    needs: dispatch-integrity
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run disposable OpenSSH integration tests
        run: python scripts/run_integration_tests.py

  smb-integration:
    needs: dispatch-integrity
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run disposable encrypted SMB integration tests
        run: python scripts/run_smb_integration_tests.py

  browser-e2e-shards:
    needs: dispatch-integrity
    name: browser-e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            e2e_port: 4173
            run_static_checks: true
          - shard: 2
            e2e_port: 4174
            run_static_checks: false
    env:
      WEBSSH_E2E_PORT: ${{ matrix.e2e_port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Mirror the runtime version shipped in the Docker image.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install LDAP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Check vendored frontend assets
        if: matrix.run_static_checks
        run: npm run vendor:check

      - name: Run JavaScript unit tests
        if: matrix.run_static_checks
        run: npm run test:js

      - name: Install locked Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run required local browser gate
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-${{ matrix.shard }}-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    needs: browser-e2e-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Require all browser shards
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shards.result }}
        run: test "$SHARD_RESULT" = success

  container-threading-smoke:
    needs: dispatch-integrity
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and start this checkout
        shell: bash
        run: |
          image_tag="webssh-ci:${GITHUB_SHA}"
          container_name="webssh-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_label="webssh.ci-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ownership_value="${ownership_label#*=}"

          cleanup_start_failure() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ] && docker container inspect "$container_name" >/dev/null 2>&1; then
              if actual_label="$(docker container inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$container_name" 2>/dev/null)"; then
                if [ "$actual_label" = "$ownership_value" ]; then
                  docker rm --force "$container_name" || true
                fi
              fi
            fi

            exit "$status"
          }
          trap cleanup_start_failure EXIT

          if docker container inspect "$container_name" >/dev/null 2>&1; then
            echo "Refusing to reuse pre-existing container $container_name" >&2
            exit 1
          fi

          docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag "$image_tag" .
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_tag")"
          if [ "$image_revision" != "$GITHUB_SHA" ]; then
            echo "Built image revision does not match the checkout" >&2
            exit 1
          fi
          docker run --detach --name "$container_name" \
            --label "$ownership_label" \
            --env SECRET_KEY="container-smoke-test-secret" \
            --publish 127.0.0.1::5000 \
            "$image_tag"

          {
            echo "WEBSSH_CI_CONTAINER=$container_name"
            echo "WEBSSH_CI_CONTAINER_LABEL_VALUE=$ownership_value"
            echo "WEBSSH_CI_CONTAINER_CREATED=1"
          } >> "$GITHUB_ENV"
          trap - EXIT

      - name: Verify gthread worker and readiness
        shell: bash
        run: |
          binding="$(docker port "$WEBSSH_CI_CONTAINER" 5000/tcp | head --lines=1)"
          port="${binding##*:}"

          for attempt in {1..30}; do
            ready_status="$(curl --output /dev/null --silent --show-error --write-out '%{http_code}' "http://127.0.0.1:${port}/ready" || true)"
            if docker logs "$WEBSSH_CI_CONTAINER" 2>&1 | grep --quiet --fixed-strings "Using worker: gthread" \
              && [ "$ready_status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$WEBSSH_CI_CONTAINER" >&2
          exit 1

      - name: Verify graceful gthread shutdown
        shell: bash
        run: |
          actual_label="$(docker inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_CI_CONTAINER")"
          if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
            echo "Refusing to stop container with unexpected ownership label" >&2
            exit 1
          fi
          docker stop --time 35 "$WEBSSH_CI_CONTAINER"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$WEBSSH_CI_CONTAINER")"
          test "$exit_code" = "0"

      - name: Clean up created container
        if: always() && env.WEBSSH_CI_CONTAINER_CREATED == '1'
        shell: bash
        run: |
          if ! docker container inspect "$WEBSSH_CI_CONTAINER" >/dev/null 2>&1; then
            exit 0
          fi

          actual_label="$(docker container inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_CI_CONTAINER")"
          if [ "$actual_label" != "$WEBSSH_CI_CONTAINER_LABEL_VALUE" ]; then
            echo "Refusing to remove container with unexpected ownership label" >&2
            exit 1
          fi

          docker rm --force "$WEBSSH_CI_CONTAINER"
