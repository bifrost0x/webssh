name: Tests

on:
  pull_request:
    branches: [main, go]
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit that the caller will publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA that this manually dispatched run must test
        required: true
        type: string

# Main and tag pushes invoke this workflow only through docker-publish.yml.
# Standalone PR runs supersede each other; release callers retain their exact-SHA gates.
concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.expected_sha && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-integrity:
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify manually dispatched commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
          fi

      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject private development artifacts
        run: python scripts/check_repository_hygiene.py
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          set -eu
          tool_dir="$RUNNER_TEMP/webssh-gitleaks"
          mkdir -p "$tool_dir"
          # GitHub release downloads can fail with HTTP 504 for hours. The same
          # release from its digest-pinned image is the fallback, never another one.
          if curl --fail --silent --show-error --location --retry 3 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$tool_dir/gitleaks.tar.gz"; then
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check
            tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          else
            container="$(docker create ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f)"
            docker cp "$container:/usr/bin/gitleaks" "$tool_dir/gitleaks"
            docker rm "$container" >/dev/null
          fi
          # The release binary and the image differ only in a leading "v".
          version="$("$tool_dir/gitleaks" version)"
          test "${version#v}" = "8.30.1"
      - name: Scan tracked source and verify secret-detection canaries
        run: python scripts/check_repository_secrets.py --gitleaks "$RUNNER_TEMP/webssh-gitleaks/gitleaks"
      - name: Classify changes
        id: scope
        env:
          CI_FORCE_FULL: ${{ inputs.expected_sha != '' }}
        run: python scripts/ci_change_scope.py
      - name: Verify first-party license declarations
        run: |
          python -m unittest discover -s tests -p test_license_consistency.py -v
          python scripts/check_license_consistency.py
      - name: Validate documentation contracts
        run: python -m unittest discover -s tests -p test_documentation_surface.py -v

  # Static checks are cheap, so they run for every change scope without
  # waiting for the scope classification.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.toml

      - name: Install Python tool dependencies
        run: |
          uv pip install --python "$(command -v python)" --require-hashes -r requirements-test.txt

      - name: Check dependency locks
        shell: pwsh
        run: ./scripts/lock_requirements.ps1 -Check

      - name: Lint Python
        run: python -m ruff check --output-format=github .

      # The checks of the CI scripts, workflows, policies and the frontend
      # sources; the golden data set checks need the Python release and run
      # in python-oracles.yml.
      - name: Run repository tool and policy tests
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Check vendored frontend assets
        run: npm run vendor:check

      - name: Lint JavaScript
        run: npm run lint:js

      # test:js also verifies the generated sign-in translations (i18n:auth:check).
      - name: Run JavaScript unit tests
        run: npm run test:js

  browser-e2e-shards:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: browser-e2e (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      WEBSSH_E2E_PORT: '4173'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # One build for every lane; tests/e2e/go-backend.js starts it.
      - name: Build the e2e server
        run: |
          node -e "console.log(require('./tests/e2e/go-binary').webssh('e2e'))"
          echo "WEBSSH_E2E_GO_BINARY=$PWD/.test-run.tmp/webssh-e2e" >> "$GITHUB_ENV"

      - name: Install locked Playwright Chromium
        run: node scripts/install-ci-chromium.js

      - name: Verify directory sync with real tmux
        if: matrix.group == 1
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          node tests/integration/tmux_sync.cjs

      - name: Run required local browser gate
        run: node scripts/run-e2e-ci-parallel.js --group=${{ matrix.group }}/8 --lanes=4

      - name: Upload browser timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-${{ matrix.group }}-timings
          overwrite: true
          path: test-results/e2e-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-${{ matrix.group }}-failure
          overwrite: true
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-fonts:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    name: browser-fonts (Firefox and WebKit)
    runs-on: ubuntu-24.04
    # Browser downloads can stall; do not leave the PR gate running indefinitely.
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      WEBSSH_E2E_FAST_HASHING: '1'
      WEBSSH_FONT_BROWSER_CONTAINER: 'webssh-fonts-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the e2e server
        run: |
          node -e "console.log(require('./tests/e2e/go-binary').webssh('e2e'))"
          echo "WEBSSH_E2E_GO_BINARY=$PWD/.test-run.tmp/webssh-e2e" >> "$GITHUB_ENV"
      - name: Start pinned Firefox/WebKit browser server
        shell: bash
        run: |
          set -euo pipefail
          # The Microsoft Playwright image includes browser binaries and OS libraries.
          # This avoids invoking apt on ephemeral hosted runners during font E2E.
          node -e 'if (require("playwright/package.json").version !== "1.65.1") process.exit(1)'
          docker run --detach --rm --init --network host --user pwuser \
            --name "$WEBSSH_FONT_BROWSER_CONTAINER" \
            --label "webssh.ci-run=$GITHUB_RUN_ID" \
            --mount "type=bind,source=$PWD/node_modules,target=/work/node_modules,readonly" \
            --workdir /work \
            mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 \
            node /work/node_modules/playwright/cli.js run-server --host 127.0.0.1 --port 4355
          ready=false
          for _ in $(seq 1 60); do
            if timeout 2 bash -c 'echo >/dev/tcp/127.0.0.1/4355' 2>/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$WEBSSH_FONT_BROWSER_CONTAINER" | grep -qx true; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$WEBSSH_FONT_BROWSER_CONTAINER" || true
            echo '::error::Pinned Playwright browser server failed to start'
            exit 1
          fi
      - name: Verify live terminal font changes
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: 'ws://127.0.0.1:4355/'
        run: |
          WEBSSH_E2E_PORT=4173 \
            WEBSSH_E2E_TIMING_FILE="test-results/e2e-fonts-firefox.json" \
              npm run test:e2e -- tests/e2e/session-workspace.spec.js tests/e2e/terminal-appearance.spec.js \
            --browser=firefox --output="test-results/font-firefox" \
              --grep='font changes preserve|failed font downloads|overview defers terminal fonts|restored terminals load their saved fonts' &
          firefox_pid=$!
          WEBSSH_E2E_PORT=4174 \
            WEBSSH_E2E_TIMING_FILE="test-results/e2e-fonts-webkit.json" \
              npm run test:e2e -- tests/e2e/session-workspace.spec.js tests/e2e/terminal-appearance.spec.js \
            --browser=webkit --output="test-results/font-webkit" \
              --grep='font changes preserve|failed font downloads|overview defers terminal fonts|restored terminals load their saved fonts' &
          webkit_pid=$!
          firefox_status=0
          webkit_status=0
          wait "$firefox_pid" || firefox_status=$?
          wait "$webkit_pid" || webkit_status=$?
          test "$firefox_status" -eq 0
          test "$webkit_status" -eq 0
      - name: Upload font-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-fonts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop pinned browser server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect "$WEBSSH_FONT_BROWSER_CONTAINER" >/dev/null 2>&1; then
            owner="$(docker inspect --format '{{ index .Config.Labels "webssh.ci-run" }}' "$WEBSSH_FONT_BROWSER_CONTAINER")"
            if [ "$owner" != "$GITHUB_RUN_ID" ]; then
              echo '::error::Refusing to remove container without matching CI ownership label'
              exit 1
            fi
            docker rm --force --volumes "$WEBSSH_FONT_BROWSER_CONTAINER"
          fi

  browser-e2e:
    needs: [dispatch-integrity, browser-e2e-shards, browser-fonts]
    if: ${{ always() && needs.dispatch-integrity.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require all browser shards
        env:
          SHARD_RESULT: ${{ needs.browser-e2e-shards.result }}
          FONT_RESULT: ${{ needs.browser-fonts.result }}
        run: |
          test "$SHARD_RESULT" = success
          test "$FONT_RESULT" = success

  # tests/image/check.sh builds the release and debug targets of the
  # Dockerfile and checks them under the restrictions of
  # docker-compose.hardened.yml: configuration, users, signals, time zones,
  # command forms, the Compose files of 3.3 and 3.4, the production profile
  # with offline backup and restore, and the Unraid template.
  container-image:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and check the image of this checkout
        env:
          IMG: webssh-ci:${{ github.sha }}
          DEBUG_IMG: webssh-ci-debug:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: tests/image/check.sh

  # A data volume of the last Python release is upgraded in place and
  # rolled back (tests/image/upgrade.sh).
  container-upgrade:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build this checkout
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag "webssh-upgrade:${GITHUB_SHA}" .

      - name: Upgrade a 3.3 data volume and roll back
        env:
          IMG: webssh-upgrade:${{ github.sha }}
        run: tests/image/upgrade.sh

  release-contract:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify immutable release promotion in an owned registry
        run: python3 scripts/check_release_promotion.py

  # The Go gates of go.yml (builds, vet, staticcheck, race tests, the
  # security scanners, the go-smb2 fork, network namespace and SSH
  # banner). Their result is the result of this
  # job, so a red Go job fails all-tests.
  go-gates:
    needs: dispatch-integrity
    if: needs.dispatch-integrity.outputs.mode == 'full'
    permissions:
      contents: read
    uses: ./.github/workflows/go.yml

  all-tests:
    needs: [dispatch-integrity, lint, browser-e2e-shards, browser-fonts, browser-e2e, container-image, container-upgrade, release-contract, go-gates]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Require every test gate
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/check_release_gates.py
