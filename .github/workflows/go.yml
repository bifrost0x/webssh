name: Go

# Gates for the Go backend (ADR 0002). Pull requests and release runs
# reach them through the required job all-tests of tests.yml, which calls
# this workflow as its job go-gates: a red Go job turns all-tests red.
# Every push to the integration branch `go` runs them on its own as well.
on:
  workflow_call:
  push:
    branches: [go]
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: called from tests.yml, the run belongs to the
# caller's group, which supersedes pull request runs and keeps the exact
# commit of release runs; every commit pushed to `go` is checked.

# The patterns cover the whole module. "./..." is not used because a local
# npm install places third-party Go files under node_modules; the
# architecture tests reject Go code outside cmd/ and internal/.
env:
  GO_PACKAGES: ./cmd/... ./internal/...
  STATICCHECK_VERSION: 2026.2.2
  GOVULNCHECK_VERSION: v1.10.0
  GOSEC_VERSION: v2.30.0
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOWORK: "off"

jobs:
  build:
    # WebSSH is built for Linux only: Docker on linux/amd64 and
    # linux/arm64, and Unraid.
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stage static assets for embedding
        run: scripts/stage-webassets.sh

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -o "$RUNNER_TEMP/webssh-$GOOS-$GOARCH" ./cmd/webssh
          # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
          go vet $GO_PACKAGES

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stage static assets for embedding
        run: scripts/stage-webassets.sh

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
          go vet $GO_PACKAGES

      # The lab tests run only against the lab and the disposable Herdr and
      # Warpgate hosts; vetting them keeps their builds from rotting.
      - name: Vet the lab builds
        run: |
          for tags in lab herdr warpgate; do
            # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
            go vet -tags "$tags" $GO_PACKAGES
          done

      - name: Check for pending go fix rewrites
        run: |
          # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
          go fix -diff $GO_PACKAGES

      - name: Install staticcheck
        run: go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"

      - name: Staticcheck
        run: |
          # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
          staticcheck $GO_PACKAGES

      # Includes the architecture tests: package map, import rules, file
      # sizes, package names and the module allowlist.
      # internal/migrate/legacy replays the golden data directories with
      # the race detector and needs more than the default ten minutes.
      - name: Test with race detector
        run: |
          # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
          go test -race -count=1 -timeout 30m $GO_PACKAGES

      # The end-to-end harness is built only with the tag e2e; keep that
      # build vetted and tested so it does not rot between browser runs.
      - name: Vet and test the e2e build
        run: |
          go vet -tags e2e ./cmd/...
          go test -race -count=1 -timeout 30m -tags e2e ./cmd/... ./internal/e2eseed

      # Release builds set the version with the linker (ADR 0004); this
      # keeps the variable names and the output format from drifting.
      - name: Check linker-set version
        run: |
          go build -trimpath -o "$RUNNER_TEMP/webssh" -ldflags "-X github.com/bifrost0x/webssh/internal/buildinfo.version=3.4.0 -X github.com/bifrost0x/webssh/internal/buildinfo.revision=$GITHUB_SHA" ./cmd/webssh
          test "$("$RUNNER_TEMP/webssh" version)" = "3.4.0 (${GITHUB_SHA:0:7})"

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stage static assets for embedding
        run: scripts/stage-webassets.sh

      # Tools are installed by exact version through the Go checksum
      # database and never enter go.mod (ADR 0004).
      - name: Install pinned security scanners
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/securego/gosec/v2/cmd/gosec@$GOSEC_VERSION"

      # Architecture-specific code is only reachable for its own target.
      - name: Govulncheck
        run: |
          for target in linux/amd64 linux/arm64; do
            echo "govulncheck for $target"
            # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
            GOOS="${target%/*}" GOARCH="${target#*/}" govulncheck $GO_PACKAGES
          done

      - name: Gosec
        run: |
          # shellcheck disable=SC2086 # GO_PACKAGES is a list of package patterns, split on purpose
          gosec -quiet $GO_PACKAGES

  # third_party/go-smb2 is a patched fork of go-smb2 v2 in its own module
  # (third_party/README.md). Its packages are outside GO_PACKAGES, so its
  # own suite runs here, including the tests of the local patch. The
  # integration tests skip without client_conf.json. Vulnerabilities in the
  # v2 module path are also tracked by hand: the vulnerability database
  # lists GO-2026-5051 for the v1 path only.
  smb-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: third_party/go-smb2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install pinned analyzers
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"

      - name: Staticcheck
        run: staticcheck ./...

      - name: Govulncheck
        run: govulncheck ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  # The kernel-facing route tests of internal/netpolicy in an own network
  # namespace (tailnet routes, blackhole and prohibit routes, rule 5270),
  # as an unprivileged user; the lab variant needs the test lab and runs
  # there.
  netns:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build an image with iproute2
        run: printf 'FROM alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf\nRUN apk add --no-cache iproute2\n' | docker build -t webssh-netns-tools -

      - name: Route tests in a crafted namespace
        env:
          NETNS_TOOLS_IMAGE: webssh-netns-tools
        run: internal/netpolicy/testdata/netns-test.sh crafted

  # TestBannerServer (tag lab) against a throwaway OpenSSH server with a
  # pre-authentication banner, built from the lab's SSH image (base pinned
  # by digest in its Dockerfile). The script removes its container on exit.
  ssh-banner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the lab SSH image
        run: docker build -t webssh-banner-ssh tests/lab/images/ssh

      - name: Banner test against OpenSSH
        env:
          BANNER_IMAGE: webssh-banner-ssh
        run: internal/ssh/client/testdata/banner-lab.sh
