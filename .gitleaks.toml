# The lab passes per-run secrets generated into its ignored runtime directory.
[[rules]]
id = "curl-auth-user"

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)tests/lab/smoke\.sh$''']
regexes = ['''^'webssh-lab:\$\(secret dex-client-secret\)'$''']

# The example JWS of RFC 7515, appendices A.2 and A.3 (payload
# {"iss":"joe",...}), signed with the RFC's published example keys.
[[allowlists]]
description = "RFC 7515 example JWS"
condition = "AND"
targetRules = ["jwt"]
paths = ['''(^|/)internal/auth/oidc/testdata/rfc_jws_vectors\.json$''']
regexes = ['''^eyJhbGciOiJ(SUzI1NiJ9|FUzI1NiJ9)\.eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6Ly9leGFtcGxlLmNvbS9pc19yb290Ijp0cnVlfQ\.''']
