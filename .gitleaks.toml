title = "WebSSH tracked-source secret scan"

[extend]
useDefault = true

# Keep provider and private-key rules enabled. These exact expressions are
# source-code identifiers, not credentials; never exempt whole tests/vendor trees.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)static/js/app\.js$''']
regexes = ['''^Ctrl\+Shift\+Tab$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)static/vendor/xterm/xterm(?:-addon-search)?\.js$''']
regexes = ['''^t\.(?:TwoKeyMap=void|Sequencer=t\.Throttler=void)$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)site/vendor/vis-network-9\.1\.6/vis-network\.min\.js$''']
regexes = ['''^_getDistanceToBezierEdge2$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/migrate/legacy/sshkeys\.go$''']
regexes = ['''^0123456789abcdef$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/migrate/legacy/safety_test\.go$''']
regexes = ['''^9971eb1e-92db-4b73-93dd-b5c5d5d8387c\.pem$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/migrate/legacy/golden_legacy_test\.go$''']
regexes = ['''^ed25519_pkcs8$''']

# The synthetic SECRET_KEY of the configuration vectors (testSecret in
# internal/config/env_test.go). Gitleaks also reports cut-off prefixes of
# it in single lines, which the optional tail covers.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/config/testdata/python_env\.jsonl$''']
regexes = ['''^0123456789abc[0-9a-f]{0,19}(-test-only)?$''']

# File names of synthetic SSH keys of the golden data set (UUIDs).
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/migrate/legacy/m1_negative_test\.go$''']
regexes = ['''^(9971eb1e-92db-4b73-93dd-b5c5d5d8387c|168716ca-55b4-4155-8827-f5d378fe0ad0)\.pem$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/hosts/testdata/oracle\.py$''']
regexes = ['''^9971eb1e-92db-4b73-93dd-b5c5d5d8387c$''']

# The sample nonce of RFC 6455, section 1.3 ("the sample nonce").
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/realtime/server_test\.go$''']
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# Authenticator data of a Chromium virtual authenticator: the SHA-256 of
# the relying party "localhost", flags 0x05 and the signature counter 2.
# Public by design (WebAuthn section 6.1).
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/auth/webauthn/testdata/chromium-virtual-authenticator\.json$''']
regexes = ['''^SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAAAg$''']

# Public test vector of the Fernet specification, not a credential.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)internal/fernet/fernet_test\.go$''']
regexes = ['''^cw_0x689RpI-jtRR7oE8h_eQsKImvJapLeSbXpwF4e4=$''']

# The synthetic values of the golden data sets (tests/golden/generate.py,
# fixed seed), each by its exact value as the scan reports it (base64
# decoded where gitleaks decodes it). A changed or added value in these
# files is reported; extend the list only after checking that the value
# comes from the generator.
