# WebSSH Go preview (M1) for a trusted LAN; guide: docs/preview/m1.md.
# This is a preview, not a release:
# it runs next to an existing Python instance and never uses its volumes.
#
# Start from the repository root:
#   docker compose -f deploy/docker/compose.m1.yml up -d --build
#   docker compose -f deploy/docker/compose.m1.yml exec webssh-go /app/webssh create-admin --username <name>
#   Browser: http://<LAN-IP>:5001
#
# The host port defaults to 5001 (WEBSSH_GO_PORT is read by Compose only),
# so a Python instance can keep 5000; inside the container WebSSH listens
# on 5000. The volumes have fixed names, webssh_go_data and
# webssh_go_recovery, separate from the Python volumes.
#
# Trying existing data: the preview writes to its volume, so it gets a copy.
# Stop the Python container first (an open database journal or lock stops
# the migration), find its data volume with "docker volume ls" (with
# docker-compose.yml it is <project>_webssh_data, for example
# webssh_webssh_data) and copy it into a fresh webssh_go_data before the
# first start of the preview. The source is mounted read-only; Docker seeds
# the new volume from the image, so it belongs to 1000:1000:
#   docker stop webssh
#   docker run --rm --entrypoint /bin/sh \
#     -v <python-volume>:/from:ro -v webssh_go_data:/app/data \
#     webssh-go:m1-debug -c 'cp -a /from/. /app/data/'
#   docker start webssh
#
# Client addresses: with rootless Docker and the default port driver of
# rootlesskit ("builtin") WebSSH sees one internal address for every
# client. All LAN clients then share the per-address sign-in limits and the
# audit log shows that one address. The slirp4netns port driver or rootful
# Docker keep the real address.
#
# Compose files written for the Python image that override the health
# check with the documented python command (also as "CMD-SHELL ...") keep
# working: python and /bin/sh in the image accept exactly those commands
# and run the same probe. The image's own check is "/app/webssh healthcheck".
#
# Passkeys and secure cookies need HTTPS. Over http://<LAN-IP> passkeys do
# not work (over http://localhost they do). For HTTPS in the LAN add the
# TLS overlay, which puts Caddy with an internal CA in front:
#   WEBSSH_GO_TLS_HOST=webssh.lan docker compose \
#     -f deploy/docker/compose.m1.yml -f deploy/docker/compose.m1.tls.yml up -d --build

name: webssh-go-m1

services:
  webssh-go:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: release
      args:
        VERSION: 3.4.0-m1
        VCS_REF: ${WEBSSH_GO_VCS_REF:-unknown}
    image: webssh-go:m1
    container_name: webssh-go
    restart: unless-stopped
    # Allows the bounded shutdown (maximum 30s) to finish.
    stop_grace_period: 40s
    ports:
      - "${WEBSSH_GO_PORT:-5001}:5000"
    environment:
      # Homelab settings as in docker-compose.yml.
      - DEPLOYMENT_PROFILE=homelab
      - CORS_ORIGINS=*
      - ALLOW_CORS_WILDCARD=true
      - TRUSTED_PROXIES=0
      - SESSION_COOKIE_SECURE=false
      # The first administrator is created with the CLI (see above), not by
      # the first visitor of the registration page.
      - BOOTSTRAP_REGISTRATION_ENABLED=false
      - BACKUP_TEMP_DIR=/app/recovery
      - BACKUP_RECOVERY_DURABLE=true
      # Passed through from the host when set, for example TZ=Europe/Berlin.
      - TZ
    volumes:
      - webssh_go_data:/app/data
      - webssh_go_recovery:/app/recovery
    # Restrictions as in docker-compose.hardened.yml. The image needs no
    # capabilities and writes only to /app/data, /app/recovery and /tmp.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    # The health check of the image runs "/app/webssh healthcheck" without a
    # shell; no override is needed.

volumes:
  # Fixed names, so the copy recipe above and "docker volume" commands find
  # them whatever the Compose project is called.
  webssh_go_data:
    name: webssh_go_data
  webssh_go_recovery:
    name: webssh_go_recovery
