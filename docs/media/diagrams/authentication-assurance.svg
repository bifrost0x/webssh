<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="authentication-assurance-title authentication-assurance-desc">
  <title id="authentication-assurance-title">WebSSH authentication assurance</title>
  <desc id="authentication-assurance-desc">Flowchart showing conservative assurance after primary authentication, optional MFA and restricted Recovery, followed by action-bound administrator step-up for sensitive mutations.</desc>
  <defs>
    <style>
      .title{font:700 32px "Segoe UI",Arial,sans-serif;fill:#15283a}.subtitle{font:16px "Segoe UI",Arial,sans-serif;fill:#52677b}.brand{font:700 20px "Segoe UI",Arial,sans-serif;fill:#245f9e}.panel{fill:rgba(36,95,158,.025);stroke:#afc1d2;stroke-width:1.2}.panel-label{font:600 12px "Cascadia Mono",Consolas,monospace;letter-spacing:.12em;fill:#52677b}.node{fill:#fff;stroke:#3e5368;stroke-width:1.2}.focal{fill:#eaf2fb;stroke:#245f9e;stroke-width:2}.restricted{fill:#fff8e8;stroke:#8a6400;stroke-width:1.6}.decision{fill:#fff;stroke:#3e5368;stroke-width:1.4}.node-title{font:600 16px "Segoe UI",Arial,sans-serif;fill:#15283a}.node-sub{font:12px "Cascadia Mono",Consolas,monospace;fill:#52677b}.node-sub-small{font:11px "Cascadia Mono",Consolas,monospace;fill:#52677b}.tag{font:600 8px "Cascadia Mono",Consolas,monospace;letter-spacing:.12em;fill:#245f9e}.flow{fill:none;stroke:#52677b;stroke-width:2;marker-end:url(#auth-arrow)}.accent{fill:none;stroke:#245f9e;stroke-width:2.4;marker-end:url(#auth-arrow-link)}.passive{fill:none;stroke:#818c9b;stroke-width:1.6;stroke-dasharray:8 8;marker-end:url(#auth-arrow)}.label{font:600 11px "Cascadia Mono",Consolas,monospace;letter-spacing:.06em;fill:#52677b}.legend{font:12px "Segoe UI",Arial,sans-serif;fill:#52677b}.source{font:11px "Cascadia Mono",Consolas,monospace;fill:#818c9b}
    </style>
    <marker id="auth-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#52677b"/></marker>
    <marker id="auth-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#245f9e"/></marker>
  </defs>

  <rect width="1440" height="900" fill="#f4f7fb"/>
  <rect x="0" y="0" width="16" height="900" fill="#245f9e"/>
  <text class="title" x="56" y="64">Authentication assurance</text>
  <text class="subtitle" x="56" y="96">Identity, optional MFA, Recovery, and one-use administrator authorization</text>
  <text class="brand" x="1384" y="64" text-anchor="end">WebSSH</text>

  <rect class="panel" x="48" y="136" width="816" height="636" rx="8"/>
  <rect x="72" y="128" width="144" height="24" fill="#f4f7fb"/>
  <text class="panel-label" x="80" y="144">SIGN-IN SESSION</text>
  <rect class="panel" x="912" y="136" width="480" height="636" rx="8"/>
  <rect x="936" y="128" width="176" height="24" fill="#f4f7fb"/>
  <text class="panel-label" x="944" y="144">ADMIN STEP-UP</text>

  <!-- Connectors -->
  <line class="flow" x1="456" y1="228" x2="456" y2="268"/>
  <line class="accent" x1="456" y1="364" x2="456" y2="404"/>
  <line class="flow" x1="456" y1="500" x2="456" y2="520"/>

  <path class="flow" d="M 336 596 H 248 Q 240 596 240 604 V 680"/>
  <rect x="152" y="612" width="160" height="16" fill="#f4f7fb"/>
  <text class="label" x="232" y="624" text-anchor="middle">NO · OR FACTOR PASSED</text>

  <path class="flow" d="M 576 596 H 664 Q 672 596 672 604 V 680"/>
  <rect x="600" y="612" width="80" height="16" fill="#f4f7fb"/>
  <text class="label" x="640" y="624" text-anchor="middle">RECOVERY</text>

  <line class="flow" x1="1120" y1="340" x2="1120" y2="396"/>
  <line class="accent" x1="1120" y1="516" x2="1120" y2="572"/>

  <!-- Login nodes -->
  <rect class="node" x="336" y="164" width="240" height="64" rx="32"/>
  <text class="node-title" x="456" y="204" text-anchor="middle">Sign-in attempt</text>

  <rect class="node" x="296" y="268" width="320" height="96" rx="8"/>
  <text class="tag" x="312" y="288">PRIMARY</text>
  <text class="node-title" x="456" y="312" text-anchor="middle">Verify the selected identity</text>
  <text class="node-sub" x="456" y="336" text-anchor="middle">password · LDAP · OIDC · Passkey</text>

  <rect class="focal" x="296" y="404" width="320" height="96" rx="8"/>
  <text class="tag" x="312" y="424">ASSURANCE</text>
  <text class="node-title" x="456" y="448" text-anchor="middle">Derive conservative assurance</text>
  <text class="node-sub" x="456" y="472" text-anchor="middle">unmapped evidence stays BASIC</text>

  <polygon class="decision" points="456,520 576,596 456,672 336,596"/>
  <text class="node-title" x="456" y="584" text-anchor="middle">Account MFA enabled</text>
  <text class="node-title" x="456" y="608" text-anchor="middle">and still unmet?</text>
  <text class="node-sub-small" x="456" y="632" text-anchor="middle">Passkey · TOTP · Recovery</text>

  <rect class="node" x="240" y="680" width="240" height="80" rx="40"/>
  <text class="node-title" x="360" y="716" text-anchor="middle">Normal session</text>
  <text class="node-sub-small" x="360" y="740" text-anchor="middle">assurance stored server-side</text>

  <rect class="restricted" x="552" y="680" width="240" height="80" rx="8"/>
  <text class="node-title" x="672" y="716" text-anchor="middle">Restricted security session</text>
  <text class="node-sub-small" x="672" y="740" text-anchor="middle">factor repair or MFA disable only</text>

  <!-- Administrator nodes -->
  <rect class="node" x="992" y="220" width="256" height="120" rx="8"/>
  <text class="tag" x="1008" y="240">ADMIN</text>
  <text class="node-title" x="1120" y="268" text-anchor="middle">Sensitive mutation</text>
  <text class="node-sub-small" x="1120" y="292" text-anchor="middle">exact action · exact target</text>
  <text class="node-sub-small" x="1120" y="312" text-anchor="middle">from the authenticated session</text>

  <rect class="node" x="968" y="396" width="304" height="120" rx="8"/>
  <text class="tag" x="984" y="416">GATE</text>
  <text class="node-title" x="1120" y="444" text-anchor="middle">Fresh administrator step-up</text>
  <text class="node-sub-small" x="1120" y="468" text-anchor="middle">password · LDAP · Passkey · TOTP</text>
  <text class="node-sub-small" x="1120" y="488" text-anchor="middle">or sufficient OIDC reauthentication</text>

  <rect class="focal" x="992" y="572" width="256" height="112" rx="8"/>
  <text class="tag" x="1008" y="592">GRANT</text>
  <text class="node-title" x="1120" y="620" text-anchor="middle">Authorized exact mutation</text>
  <text class="node-sub-small" x="1120" y="644" text-anchor="middle">one use · max five minutes</text>
  <text class="node-sub-small" x="1120" y="664" text-anchor="middle">never browser-persisted</text>

  <line x1="48" y1="812" x2="1392" y2="812" stroke="#afc1d2" stroke-width="1"/>
  <rect x="64" y="836" width="20" height="12" fill="#eaf2fb" stroke="#245f9e"/>
  <text class="legend" x="96" y="848">assurance or authorization gate</text>
  <rect x="376" y="836" width="20" height="12" fill="#fff8e8" stroke="#8a6400"/>
  <text class="legend" x="408" y="848">restricted Recovery session</text>
  <text class="source" x="1384" y="848" text-anchor="end">current implementation · WebSSH 2.0</text>
</svg>
