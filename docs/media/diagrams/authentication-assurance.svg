<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="authentication-assurance-title authentication-assurance-desc">
  <title id="authentication-assurance-title">WebSSH authentication assurance</title>
  <desc id="authentication-assurance-desc">Flowchart showing conservative assurance after primary authentication with password, LDAP, OIDC, GitHub or Passkey, optional MFA and a restricted Recovery session, followed by an action-bound step-up for sensitive administrator and account actions. A recent strong sign-in is reused; saved passwords also require HTTPS.</desc>
  <defs>
    <style>
      .title{font:700 32px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .brand{font:700 26px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .zone{font:600 12px "Cascadia Mono",Consolas,monospace;letter-spacing:2px;fill:#80969b}
      .eyebrow{font:600 10px "Cascadia Mono",Consolas,monospace;letter-spacing:1.5px}
      .node{font:600 18px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .node-s{font:600 16px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .meta{font:400 12.5px "Cascadia Mono",Consolas,monospace;fill:#adc0c4}
      .label{font:600 11px "Cascadia Mono",Consolas,monospace;letter-spacing:1px}
      .note{font:400 13px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .legend{font:400 14px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .foot{font:400 13px "Cascadia Mono",Consolas,monospace;fill:#80969b}
    </style>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#48a3b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#829da4"/></marker><marker id="arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#80969b"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4ad61"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#091012"/>
  <text class="title" x="56" y="78">Authentication assurance</text>
  <text class="subtitle" x="56" y="110">Identity, optional MFA, Recovery and one-use step-up for sensitive actions</text>
  <g transform="translate(1222 50) scale(0.36)"><rect x="6" y="6" width="116" height="116" rx="11" fill="#091012" stroke="#48a3b1" stroke-width="6"/><path d="m34 35 28 28-28 28" stroke="#48a3b1" stroke-width="8" stroke-linecap="square" fill="none"/><path d="M70 92h29" stroke="#48a3b1" stroke-width="8"/></g>
  <text class="brand" x="1274" y="83">WebSSH</text>
  <rect x="40" y="160" width="840" height="660" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="60" y="190">SIGN-IN SESSION</text>
  <rect x="920" y="160" width="480" height="660" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="940" y="190">STEP-UP · ADMIN AND ACCOUNT</text>
  <!-- Sign-in nodes -->
  <rect x="300" y="196" width="240" height="52" rx="26" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="node" x="420" y="228" text-anchor="middle">Sign-in attempt</text>
  <rect x="250" y="280" width="340" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="268" y="306" fill="#48a3b1">PRIMARY</text>
  <text class="node" x="420" y="334" text-anchor="middle">Verify the chosen identity</text>
  <text class="meta" x="420" y="358" text-anchor="middle">password · LDAP · OIDC</text>
  <text class="meta" x="420" y="378" text-anchor="middle">GitHub · Passkey</text>
  <rect x="250" y="432" width="340" height="92" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="268" y="458" fill="#48a3b1">ASSURANCE</text>
  <text class="node" x="420" y="486" text-anchor="middle">Derive conservative assurance</text>
  <text class="meta" x="420" y="510" text-anchor="middle">unmapped evidence stays BASIC</text>
  <path d="M420 554 L590 610 L420 666 L250 610 Z" fill="#10191c" stroke="#829da4" stroke-width="1.5"/>
  <text class="node-s" x="420" y="605" text-anchor="middle">MFA required</text>
  <text class="node-s" x="420" y="627" text-anchor="middle">and still unmet?</text>
  <rect x="60" y="712" width="290" height="96" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="78" y="738" fill="#48a3b1">SESSION</text>
  <text class="node" x="205" y="766" text-anchor="middle">Normal session</text>
  <text class="meta" x="205" y="790" text-anchor="middle">assurance stored server-side</text>
  <rect x="490" y="712" width="300" height="96" rx="12" fill="#1d1a12" stroke="#d4ad61" stroke-width="2"/>
  <text class="eyebrow" x="508" y="738" fill="#d4ad61">RECOVERY</text>
  <text class="node" x="640" y="766" text-anchor="middle">Restricted security session</text>
  <text class="meta" x="640" y="790" text-anchor="middle">factor repair or MFA disable</text>
  <path d="M420 248 V280" fill="none" stroke="#829da4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-soft)"/>
  <path d="M420 398 V432" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M420 524 V554" fill="none" stroke="#829da4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-soft)"/>
  <path d="M250 610 H205 V712" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="218" y="676" fill="#48a3b1" text-anchor="start">NO · OR PASSKEY / TOTP</text>
  <path d="M590 610 H640 V712" fill="none" stroke="#d4ad61" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-warn)"/>
  <text class="label" x="652" y="676" fill="#d4ad61" text-anchor="start">RECOVERY CODE</text>
  <!-- Step-up nodes -->
  <rect x="960" y="214" width="400" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="978" y="240" fill="#48a3b1">ACTION</text>
  <text class="node" x="1160" y="268" text-anchor="middle">Sensitive action</text>
  <text class="meta" x="1160" y="292" text-anchor="middle">admin change · saved passwords</text>
  <text class="meta" x="1160" y="312" text-anchor="middle">automation · MFA and passkeys</text>
  <rect x="960" y="384" width="400" height="138" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="978" y="410" fill="#48a3b1">GATE</text>
  <text class="node" x="1160" y="438" text-anchor="middle">Fresh step-up</text>
  <text class="meta" x="1160" y="462" text-anchor="middle">recent strong sign-in is reused</text>
  <text class="meta" x="1160" y="482" text-anchor="middle">else password · Passkey · TOTP</text>
  <text class="meta" x="1160" y="502" text-anchor="middle">or OIDC reauthentication</text>
  <rect x="960" y="574" width="400" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="978" y="600" fill="#48a3b1">GRANT</text>
  <text class="node" x="1160" y="628" text-anchor="middle">One exact action authorized</text>
  <text class="meta" x="1160" y="652" text-anchor="middle">one use · max five minutes</text>
  <text class="meta" x="1160" y="672" text-anchor="middle">never stored in the browser</text>
  <path d="M1160 332 V384" fill="none" stroke="#829da4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-soft)"/>
  <path d="M1160 522 V574" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="note" x="1160" y="740" text-anchor="middle">Saved passwords are unlocked only over HTTPS.</text>
  <text class="note" x="1160" y="762" text-anchor="middle">Each grant is bound to the exact action and target.</text>
  <line x1="40" y1="836" x2="1400" y2="836" stroke="#2b4248" stroke-width="1"/>
  <rect x="56" y="856" width="26" height="18" rx="4" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="legend" x="94" y="870">assurance or authorization gate</text>
  <rect x="429" y="856" width="26" height="18" rx="4" fill="#1d1a12" stroke="#d4ad61" stroke-width="2"/>
  <text class="legend" x="467" y="870">restricted Recovery session</text>
  <line x1="766" y1="865" x2="796" y2="865" stroke="#48a3b1" stroke-width="2.5"/>
  <text class="legend" x="808" y="870">admitted path</text>
  <text class="foot" x="1384" y="870" text-anchor="end">WebSSH 3.0</text>
</svg>
