<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="system-trust-boundaries-title system-trust-boundaries-desc">
  <title id="system-trust-boundaries-title">WebSSH system trust boundaries</title>
  <desc id="system-trust-boundaries-desc">Architecture showing browser traffic reaching one WebSSH process, optionally through a TLS reverse proxy that forwards HTTP and WebSocket traffic and whose forwarded client address is trusted only when TRUSTED_PROXIES is set. WebSSH enforces login, MFA, CSRF, same-origin realtime connections and ownership, keeps SSH keys and saved passwords encrypted, records security audit events and sends every SSH, SFTP, probe and SMB connection through its network policy. Identity providers and SMB are optional and administrator-enabled. Direct browser access to targets is not a WebSSH path.</desc>
  <defs>
    <style>
      .title{font:700 32px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .brand{font:700 26px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .zone{font:600 12px "Cascadia Mono",Consolas,monospace;letter-spacing:2px;fill:#80969b}
      .eyebrow{font:600 10px "Cascadia Mono",Consolas,monospace;letter-spacing:1.5px;fill:#48a3b1}
      .node{font:600 18px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .meta{font:400 12.5px "Cascadia Mono",Consolas,monospace;fill:#adc0c4}
      .label{font:600 11px "Cascadia Mono",Consolas,monospace;letter-spacing:1px}
      .legend{font:400 14px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .foot{font:400 13px "Cascadia Mono",Consolas,monospace;fill:#80969b}
    </style>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#48a3b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#829da4"/></marker><marker id="arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#80969b"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#091012"/>
  <text class="title" x="56" y="78">System trust boundaries</text>
  <text class="subtitle" x="56" y="110">One supported path from the browser to owned SSH, SFTP and SMB resources</text>
  <g transform="translate(1222 50) scale(0.36)"><rect x="6" y="6" width="116" height="116" rx="11" fill="#091012" stroke="#48a3b1" stroke-width="6"/><path d="m34 35 28 28-28 28" stroke="#48a3b1" stroke-width="8" stroke-linecap="square" fill="none"/><path d="M70 92h29" stroke="#48a3b1" stroke-width="8"/></g>
  <text class="brand" x="1274" y="83">WebSSH</text>
  <rect x="40" y="160" width="205" height="650" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="60" y="190">CLIENT</text>
  <rect x="295" y="160" width="205" height="650" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="315" y="190">EDGE · OPTIONAL</text>
  <rect x="540" y="160" width="580" height="650" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="560" y="190">WEBSSH · ONE PROCESS</text>
  <rect x="1160" y="160" width="240" height="650" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="1180" y="190">MANAGED SYSTEMS</text>
  <rect x="52" y="290" width="181" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="70" y="316">USER</text>
  <text class="node" x="142.5" y="346" text-anchor="middle">Browser</text>
  <text class="meta" x="142.5" y="370" text-anchor="middle">terminal · files</text>
  <text class="meta" x="142.5" y="390" text-anchor="middle">overview · admin</text>
  <rect x="307" y="290" width="181" height="118" rx="12" fill="#10191c" stroke="#80969b" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="eyebrow" x="325" y="316">PROXY</text>
  <text class="node" x="397.5" y="346" text-anchor="middle">Reverse proxy</text>
  <text class="meta" x="397.5" y="370" text-anchor="middle">TLS termination</text>
  <text class="meta" x="397.5" y="390" text-anchor="middle">client IP: opt-in</text>
  <rect x="556" y="290" width="254" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="574" y="316">APP</text>
  <text class="node" x="683" y="346" text-anchor="middle">Flask + Socket.IO</text>
  <text class="meta" x="683" y="370" text-anchor="middle">login · MFA · step-up</text>
  <text class="meta" x="683" y="390" text-anchor="middle">CSRF · same origin · owner</text>
  <rect x="866" y="290" width="238" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="884" y="316">STATE</text>
  <text class="node" x="985" y="346" text-anchor="middle">SQLite + user data</text>
  <text class="meta" x="985" y="370" text-anchor="middle">encrypted SSH keys</text>
  <text class="meta" x="985" y="390" text-anchor="middle">and saved passwords</text>
  <rect x="556" y="470" width="254" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="574" y="496">RUNTIME</text>
  <text class="node" x="683" y="526" text-anchor="middle">Bounded workers</text>
  <text class="meta" x="683" y="550" text-anchor="middle">SSH · SFTP · automation</text>
  <text class="meta" x="683" y="570" text-anchor="middle">reachability probes</text>
  <rect x="866" y="470" width="238" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="884" y="496">EGRESS</text>
  <text class="node" x="985" y="526" text-anchor="middle">Network policy</text>
  <text class="meta" x="985" y="550" text-anchor="middle">internal ranges blocked</text>
  <text class="meta" x="985" y="570" text-anchor="middle">resolve once · allowlist</text>
  <rect x="556" y="650" width="254" height="96" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="574" y="676">LOG</text>
  <text class="node" x="683" y="706" text-anchor="middle">Security audit</text>
  <text class="meta" x="683" y="730" text-anchor="middle">bounded · redacted · rotated</text>
  <rect x="1172" y="290" width="216" height="118" rx="12" fill="#10191c" stroke="#80969b" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="eyebrow" x="1190" y="316">IDENTITY</text>
  <text class="node" x="1280" y="346" text-anchor="middle">OIDC · LDAP</text>
  <text class="meta" x="1280" y="370" text-anchor="middle">GitHub sign-in</text>
  <text class="meta" x="1280" y="390" text-anchor="middle">disabled by default</text>
  <rect x="1172" y="470" width="216" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="1190" y="496">TARGET</text>
  <text class="node" x="1280" y="526" text-anchor="middle">SSH / SFTP hosts</text>
  <text class="meta" x="1280" y="550" text-anchor="middle">host key verified</text>
  <text class="meta" x="1280" y="570" text-anchor="middle">direct or via jump</text>
  <rect x="1172" y="650" width="216" height="96" rx="12" fill="#10191c" stroke="#80969b" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="eyebrow" x="1190" y="676">FILES</text>
  <text class="node" x="1280" y="706" text-anchor="middle">SMB shares</text>
  <text class="meta" x="1280" y="730" text-anchor="middle">opt-in · encrypted</text>
  <path d="M233 349 H307" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="270" y="336" fill="#48a3b1" text-anchor="middle">HTTPS</text>
  <path d="M488 349 H556" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="520" y="336" fill="#48a3b1" text-anchor="middle">HTTP</text>
  <path d="M810 349 H866" fill="none" stroke="#829da4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-soft)"/>
  <text class="label" x="838" y="336" fill="#829da4" text-anchor="middle">STATE</text>
  <path d="M683 408 V470" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="697" y="444" fill="#48a3b1" text-anchor="start">ADMIT</text>
  <path d="M810 529 H866" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="838" y="516" fill="#48a3b1" text-anchor="middle">TCP</text>
  <path d="M1104 529 H1172" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="1140" y="516" fill="#48a3b1" text-anchor="middle">SSH</text>
  <path d="M683 588 V650" fill="none" stroke="#829da4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-soft)"/>
  <text class="label" x="697" y="624" fill="#829da4" text-anchor="start">AUDIT</text>
  <path d="M683 290 V236 H1280 V290" fill="none" stroke="#80969b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-opt)"/>
  <text class="label" x="980" y="226" fill="#80969b" text-anchor="middle">OPTIONAL SIGN-IN</text>
  <path d="M985 588 V698 H1172" fill="none" stroke="#80969b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-opt)"/>
  <text class="label" x="1080" y="688" fill="#80969b" text-anchor="middle">SMB</text>
  <path d="M142 408 V782 H1126" fill="none" stroke="#db7376" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <path d="M1130 770 l20 24 M1150 770 l-20 24" stroke="#db7376" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="830" y="770" fill="#db7376" text-anchor="middle">DIRECT TARGET ACCESS IS NOT A WEBSSH PATH</text>
  <line x1="40" y1="836" x2="1400" y2="836" stroke="#2b4248" stroke-width="1"/>
  <rect x="56" y="856" width="26" height="18" rx="4" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="legend" x="94" y="870">enforcement point</text>
  <rect x="300" y="856" width="26" height="18" rx="4" fill="none" stroke="#80969b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="legend" x="338" y="870">optional component</text>
  <line x1="620" y1="865" x2="650" y2="865" stroke="#48a3b1" stroke-width="2.5"/>
  <text class="legend" x="662" y="870">supported data path</text>
  <line x1="860" y1="865" x2="890" y2="865" stroke="#db7376" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="legend" x="902" y="870">blocked bypass</text>
  <text class="foot" x="1384" y="870" text-anchor="end">WebSSH 3.0</text>
</svg>
