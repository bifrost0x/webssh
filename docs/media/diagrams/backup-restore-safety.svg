<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="backup-restore-safety-title backup-restore-safety-desc">
  <title id="backup-restore-safety-title">WebSSH backup and restore safety</title>
  <desc id="backup-restore-safety-desc">Flowchart showing administrator step-up before backup or restore, consistent online backup snapshots, private restore staging on durable recovery storage, validation and exact confirmation, then atomic activation.</desc>
  <defs>
    <style>
      .title{font:700 32px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .brand{font:700 26px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .zone{font:600 12px "Cascadia Mono",Consolas,monospace;letter-spacing:2px;fill:#80969b}
      .eyebrow{font:600 10px "Cascadia Mono",Consolas,monospace;letter-spacing:1.5px}
      .node{font:600 18px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .node-s{font:600 16px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .meta{font:400 12.5px "Cascadia Mono",Consolas,monospace;fill:#adc0c4}
      .label{font:600 11px "Cascadia Mono",Consolas,monospace;letter-spacing:1px}
      .note{font:400 13px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .legend{font:400 14px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .foot{font:400 13px "Cascadia Mono",Consolas,monospace;fill:#80969b}
    </style>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#48a3b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#829da4"/></marker><marker id="arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#80969b"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4ad61"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#091012"/>
  <text class="title" x="56" y="78">Backup and restore safety</text>
  <text class="subtitle" x="56" y="110">Authorization, consistent snapshots, durable staging and atomic restore</text>
  <g transform="translate(1222 50) scale(0.36)"><rect x="6" y="6" width="116" height="116" rx="11" fill="#091012" stroke="#48a3b1" stroke-width="6"/><path d="m34 35 28 28-28 28" stroke="#48a3b1" stroke-width="8" stroke-linecap="square" fill="none"/><path d="M70 92h29" stroke="#48a3b1" stroke-width="8"/></g>
  <text class="brand" x="1274" y="83">WebSSH</text>
  <rect x="580" y="170" width="280" height="56" rx="28" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="node" x="720" y="204" text-anchor="middle">Administrator operation</text>
  <rect x="520" y="262" width="400" height="96" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="538" y="288" fill="#48a3b1">AUTHORIZATION</text>
  <text class="node" x="720" y="316" text-anchor="middle">Action-bound administrator step-up</text>
  <text class="meta" x="720" y="340" text-anchor="middle">exact operation · exact target · one use</text>
  <path d="M720 226 V262" fill="none" stroke="#829da4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-soft)"/>
  <path d="M720 358 V400 H360 V480" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M720 400 H1060 V480" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="540" y="390" fill="#48a3b1" text-anchor="middle">BACKUP</text>
  <text class="label" x="900" y="390" fill="#48a3b1" text-anchor="middle">RESTORE</text>
  <text class="note" x="720" y="424" text-anchor="middle">explicit operator choice</text>
  <rect x="40" y="480" width="640" height="330" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="60" y="510">BACKUP</text>
  <rect x="720" y="480" width="680" height="330" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="740" y="510">RESTORE</text>
  <!-- Backup nodes -->
  <rect x="56" y="560" width="186" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="74" y="586" fill="#48a3b1">COORDINATE</text>
  <text class="node" x="149" y="614" text-anchor="middle">Snapshot barrier</text>
  <text class="meta" x="149" y="638" text-anchor="middle">coordinate writers</text>
  <text class="meta" x="149" y="658" text-anchor="middle">service stays online</text>
  <rect x="262" y="560" width="196" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="280" y="586" fill="#48a3b1">SNAPSHOT</text>
  <text class="node" x="360" y="614" text-anchor="middle">Database + user data</text>
  <text class="meta" x="360" y="638" text-anchor="middle">consistent owned state</text>
  <text class="meta" x="360" y="658" text-anchor="middle">credentials filtered</text>
  <rect x="478" y="560" width="196" height="118" rx="12" fill="#132024" stroke="#829da4" stroke-width="1.5"/>
  <text class="eyebrow" x="496" y="586" fill="#48a3b1">ARCHIVE</text>
  <text class="node" x="576" y="614" text-anchor="middle">Manifested backup</text>
  <text class="meta" x="576" y="638" text-anchor="middle">passwords / keys omitted</text>
  <text class="meta" x="576" y="658" text-anchor="middle">single-use download</text>
  <path d="M242 619 H262" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M458 619 H478" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="note" x="360" y="740" text-anchor="middle">Saved passwords and SSH keys need a separate trusted recovery source.</text>
  <!-- Restore nodes -->
  <rect x="740" y="560" width="200" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="758" y="586" fill="#48a3b1">STAGE</text>
  <text class="node" x="840" y="614" text-anchor="middle">Private staging</text>
  <text class="meta" x="840" y="638" text-anchor="middle">durable recovery dir</text>
  <text class="meta" x="840" y="658" text-anchor="middle">quota-bounded upload</text>
  <rect x="960" y="560" width="210" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="978" y="586" fill="#48a3b1">VALIDATE</text>
  <text class="node" x="1065" y="614" text-anchor="middle">Archive + intent</text>
  <text class="meta" x="1065" y="638" text-anchor="middle">manifest · schema · paths</text>
  <text class="meta" x="1065" y="658" text-anchor="middle">exact RESTORE intent</text>
  <rect x="1190" y="560" width="200" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="1208" y="586" fill="#48a3b1">ACTIVATE</text>
  <text class="node" x="1290" y="614" text-anchor="middle">Atomic restore</text>
  <text class="meta" x="1290" y="638" text-anchor="middle">maintenance mode</text>
  <text class="meta" x="1290" y="658" text-anchor="middle">resume or restart</text>
  <path d="M940 619 H960" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M1170 619 H1190" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M840 678 V752 H1278" fill="none" stroke="#db7376" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <path d="M1280 740 l20 24 M1300 740 l-20 24" stroke="#db7376" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="1060" y="742" fill="#db7376" text-anchor="middle">UNVALIDATED BYPASS BLOCKED</text>
  <line x1="40" y1="836" x2="1400" y2="836" stroke="#2b4248" stroke-width="1"/>
  <rect x="56" y="856" width="26" height="18" rx="4" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="legend" x="94" y="870">critical authorization or activation</text>
  <rect x="474" y="856" width="26" height="18" rx="4" fill="#132024" stroke="#829da4" stroke-width="2"/>
  <text class="legend" x="512" y="870">archive</text>
  <line x1="631" y1="865" x2="661" y2="865" stroke="#db7376" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="legend" x="673" y="870">blocked unsafe path</text>
  <text class="foot" x="1384" y="870" text-anchor="end">WebSSH 3.0</text>
</svg>
