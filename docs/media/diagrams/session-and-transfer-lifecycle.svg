<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="session-and-transfer-lifecycle-title session-and-transfer-lifecycle-desc">
  <title id="session-and-transfer-lifecycle-title">WebSSH session and transfer lifecycle</title>
  <desc id="session-and-transfer-lifecycle-desc">Architecture showing realtime terminal traffic through an authenticated, same-origin Socket.IO connection and process-local SSH state. Browser uploads and downloads use owned transfer records, single-use HTTP tokens and bounded streams; server-to-server copies branch to a bounded background job without a browser HTTP token. File bodies never use Socket.IO.</desc>
  <defs>
    <style>
      .title{font:700 32px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .subtitle{font:400 17px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .brand{font:700 26px "Segoe UI Variable Display","Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .zone{font:600 12px "Cascadia Mono",Consolas,monospace;letter-spacing:2px;fill:#80969b}
      .eyebrow{font:600 10px "Cascadia Mono",Consolas,monospace;letter-spacing:1.5px}
      .node{font:600 18px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .node-s{font:600 16px "Segoe UI",Arial,sans-serif;fill:#edf4f5}
      .meta{font:400 12.5px "Cascadia Mono",Consolas,monospace;fill:#adc0c4}
      .label{font:600 11px "Cascadia Mono",Consolas,monospace;letter-spacing:1px}
      .note{font:400 13px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .legend{font:400 14px "Segoe UI",Arial,sans-serif;fill:#adc0c4}
      .foot{font:400 13px "Cascadia Mono",Consolas,monospace;fill:#80969b}
    </style>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#48a3b1"/></marker><marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#829da4"/></marker><marker id="arrow-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#80969b"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4ad61"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#091012"/>
  <text class="title" x="56" y="78">Session and transfer lifecycle</text>
  <text class="subtitle" x="56" y="110">Realtime control and bulk file bodies take deliberately different paths</text>
  <g transform="translate(1222 50) scale(0.36)"><rect x="6" y="6" width="116" height="116" rx="11" fill="#091012" stroke="#48a3b1" stroke-width="6"/><path d="m34 35 28 28-28 28" stroke="#48a3b1" stroke-width="8" stroke-linecap="square" fill="none"/><path d="M70 92h29" stroke="#48a3b1" stroke-width="8"/></g>
  <text class="brand" x="1274" y="83">WebSSH</text>
  <rect x="40" y="160" width="1360" height="220" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="60" y="190">REALTIME SSH SESSION</text>
  <rect x="40" y="430" width="1360" height="390" rx="14" fill="#0d171a" stroke="#2b4248" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text class="zone" x="60" y="460">BULK TRANSFER</text>
  <!-- Realtime nodes -->
  <rect x="70" y="220" width="250" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="88" y="246" fill="#48a3b1">BROWSER</text>
  <text class="node" x="195" y="274" text-anchor="middle">Terminal client</text>
  <text class="meta" x="195" y="298" text-anchor="middle">input · resize</text>
  <text class="meta" x="195" y="318" text-anchor="middle">output</text>
  <rect x="380" y="220" width="280" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="398" y="246" fill="#48a3b1">ADMISSION</text>
  <text class="node" x="520" y="274" text-anchor="middle">Authenticated Socket.IO</text>
  <text class="meta" x="520" y="298" text-anchor="middle">login · same origin</text>
  <text class="meta" x="520" y="318" text-anchor="middle">generation · quota</text>
  <rect x="720" y="220" width="300" height="118" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="738" y="246" fill="#48a3b1">PROCESS STATE</text>
  <text class="node" x="870" y="274" text-anchor="middle">SSHSession + Paramiko</text>
  <text class="meta" x="870" y="298" text-anchor="middle">owned channel</text>
  <text class="meta" x="870" y="318" text-anchor="middle">bounded reader</text>
  <rect x="1100" y="220" width="270" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="1118" y="246" fill="#48a3b1">REMOTE</text>
  <text class="node" x="1235" y="274" text-anchor="middle">SSH target</text>
  <text class="meta" x="1235" y="298" text-anchor="middle">host key · shell · SFTP</text>
  <text class="meta" x="1235" y="318" text-anchor="middle">via network policy</text>
  <path d="M320 279 H380" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M660 279 H720" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M1020 279 H1100" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <text class="label" x="1060" y="266" fill="#48a3b1" text-anchor="middle">I/O</text>
  <!-- Transfer nodes -->
  <rect x="70" y="480" width="250" height="96" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="88" y="506" fill="#48a3b1">BROWSER</text>
  <text class="node" x="195" y="534" text-anchor="middle">Upload / download</text>
  <text class="meta" x="195" y="558" text-anchor="middle">browser file body</text>
  <rect x="70" y="670" width="250" height="96" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="88" y="696" fill="#48a3b1">CONTROL</text>
  <text class="node" x="195" y="724" text-anchor="middle">Server-to-server copy</text>
  <text class="meta" x="195" y="748" text-anchor="middle">owned source + destination</text>
  <rect x="380" y="560" width="250" height="118" rx="12" fill="#132024" stroke="#829da4" stroke-width="1.5"/>
  <text class="eyebrow" x="398" y="586" fill="#48a3b1">OWNERSHIP</text>
  <text class="node" x="505" y="614" text-anchor="middle">Transfer record</text>
  <text class="meta" x="505" y="638" text-anchor="middle">quota · progress</text>
  <text class="meta" x="505" y="658" text-anchor="middle">cancel</text>
  <rect x="660" y="480" width="230" height="96" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="678" y="506" fill="#48a3b1">BROWSER TOKEN</text>
  <text class="node" x="775" y="534" text-anchor="middle">Single-use HTTP token</text>
  <text class="meta" x="775" y="558" text-anchor="middle">user-bound · short-lived</text>
  <rect x="920" y="480" width="230" height="96" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="938" y="506" fill="#48a3b1">BODY</text>
  <text class="node" x="1035" y="534" text-anchor="middle">Bounded HTTP stream</text>
  <text class="meta" x="1035" y="558" text-anchor="middle">upload · download · archive</text>
  <rect x="790" y="670" width="300" height="96" rx="12" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="eyebrow" x="808" y="696" fill="#48a3b1">BACKGROUND</text>
  <text class="node" x="940" y="724" text-anchor="middle">Bounded cancellable job</text>
  <text class="meta" x="940" y="748" text-anchor="middle">no browser HTTP token</text>
  <rect x="1190" y="560" width="190" height="118" rx="12" fill="#10191c" stroke="#2a3d42" stroke-width="1.5"/>
  <text class="eyebrow" x="1208" y="586" fill="#48a3b1">REMOTE</text>
  <text class="node" x="1285" y="614" text-anchor="middle">Owned SFTP side</text>
  <text class="meta" x="1285" y="638" text-anchor="middle">source or</text>
  <text class="meta" x="1285" y="658" text-anchor="middle">destination</text>
  <path d="M320 528 H350 V600 H380" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M320 718 H350 V640 H380" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M630 590 H645 V528 H660" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M890 528 H920" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M1150 528 H1170 V600 H1190" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M630 650 H710 V718 H790" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M1090 718 H1170 V640 H1190" fill="none" stroke="#48a3b1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-main)"/>
  <path d="M870 338 V418 H505 V560" fill="none" stroke="#80969b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-opt)"/>
  <text class="label" x="884" y="404" fill="#80969b" text-anchor="start">OWNED SESSION</text>
  <path d="M195 480 V400 H560 V366" fill="none" stroke="#db7376" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <path d="M550 350 l20 24 M570 350 l-20 24" stroke="#db7376" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="378" y="392" fill="#db7376" text-anchor="middle">NO FILE BODY OVER SOCKET.IO</text>
  <line x1="40" y1="836" x2="1400" y2="836" stroke="#2b4248" stroke-width="1"/>
  <line x1="56" y1="865" x2="86" y2="865" stroke="#48a3b1" stroke-width="2.5"/>
  <text class="legend" x="98" y="870">data path</text>
  <line x1="235" y1="865" x2="265" y2="865" stroke="#80969b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="legend" x="277" y="870">ownership reference</text>
  <line x1="504" y1="865" x2="534" y2="865" stroke="#db7376" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="legend" x="546" y="870">forbidden transport</text>
  <rect x="773" y="856" width="26" height="18" rx="4" fill="#0f2327" stroke="#48a3b1" stroke-width="2"/>
  <text class="legend" x="811" y="870">enforcement point</text>
  <text class="foot" x="1384" y="870" text-anchor="end">WebSSH 3.0</text>
</svg>
